<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chernarus Map | ReforgedZ</title>
    <meta property="og:title" content="ReforgedZ - Chernarus Interactive Map">
    <meta property="og:description" content="Interactive terrain map of Chernarus for ReforgedZ. 15.36km x 15.36km.">
    <meta name="theme-color" content="#cc1f1f">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
    <style>
        :root {
            --bg: #0c0c0c;
            --surface: #181818;
            --surface-raised: #202020;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.15);
            --accent: #cc1f1f;
            --accent-dim: rgba(204,31,31,0.12);
            --text: #f0f0f0;
            --text-dim: #aaa;
            --text-ghost: #777;
            --display: 'Oswald', sans-serif;
            --body: 'Inter', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-family: var(--body); background: var(--bg); color: var(--text); }

        /* ---- Top Nav ---- */
        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 2000;
            background: rgba(8,8,8,0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }
        .nav-inner {
            max-width: 1180px;
            margin: 0 auto;
            padding: 0 40px;
            height: 52px;
            display: flex;
            align-items: center;
            gap: 32px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--display);
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 3px;
            color: #fff;
            text-decoration: none;
            flex-shrink: 0;
        }
        .brand-z { color: var(--accent); }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
        }
        .nav-link {
            background: none;
            border: none;
            color: var(--text-dim);
            font-family: var(--body);
            font-size: 0.8rem;
            font-weight: 500;
            padding: 6px 12px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            transition: color 0.2s;
            border-radius: 6px;
        }
        .nav-link:hover { color: var(--text); background: rgba(255,255,255,0.04); }
        .nav-link.active { color: #fff; }

        /* ---- Map Container ---- */
        #map { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; background: #284563; }

        /* ---- Sidebar ---- */
        #sidebar {
            position: fixed;
            top: 52px;
            left: 0;
            width: 280px;
            bottom: 0;
            background: rgba(12, 12, 12, 0.95);
            color: var(--text);
            z-index: 1000;
            overflow-y: auto;
            transition: transform 0.3s ease;
            border-right: 1px solid var(--border);
            backdrop-filter: blur(8px);
        }
        #sidebar.collapsed { transform: translateX(-280px); }

        #sidebar-toggle {
            position: fixed;
            top: 62px;
            left: 290px;
            z-index: 1001;
            background: rgba(12, 12, 12, 0.95);
            color: var(--text-dim);
            border: 1px solid var(--border);
            padding: 6px 10px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 4px;
            transition: left 0.3s ease;
        }
        #sidebar-toggle:hover { color: #fff; border-color: var(--border-hover); }
        #sidebar.collapsed ~ #sidebar-toggle { left: 10px; }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header h1 {
            font-family: var(--display);
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 2px;
        }
        .sidebar-header p {
            font-size: 11px;
            color: var(--text-ghost);
        }

        /* Search */
        #search-box {
            width: 100%;
            padding: 8px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 13px;
            border-radius: 4px;
            margin-top: 10px;
            font-family: var(--body);
        }
        #search-box:focus { outline: none; border-color: var(--accent); }
        #search-box::placeholder { color: var(--text-ghost); }
        #search-results { max-height: 200px; overflow-y: auto; margin-top: 4px; }
        .search-result {
            padding: 6px 12px;
            cursor: pointer;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .search-result:hover { background: var(--accent-dim); }
        .search-result .type-badge {
            font-size: 9px;
            padding: 1px 5px;
            border-radius: 3px;
            margin-left: 6px;
        }

        /* Layer controls */
        .layer-section {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
        }
        .layer-section h3 {
            font-family: var(--display);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-ghost);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .layer-toggle {
            display: flex;
            align-items: center;
            padding: 4px 0;
            cursor: pointer;
            font-size: 13px;
        }
        .layer-toggle input { margin-right: 8px; accent-color: var(--accent); }
        .layer-icon {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .layer-count {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-ghost);
        }

        /* Coordinate display */
        #coords-display {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(12, 12, 12, 0.9);
            color: var(--text-dim);
            padding: 5px 14px;
            border-radius: 4px;
            font-size: 12px;
            font-family: 'Consolas', monospace;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        /* Credits */
        #credits {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(12, 12, 12, 0.85);
            color: var(--text-ghost);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 1000;
            border: 1px solid var(--border);
        }

        /* Grid overlay label */
        .grid-label {
            color: rgba(255,255,255,0.3);
            font-size: 11px;
            font-family: monospace;
            white-space: nowrap;
        }

        /* Custom marker styles */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
            font-size: 14px;
            color: #fff;
            text-align: center;
            line-height: 1;
        }

        /* Popup styling */
        .leaflet-popup-content-wrapper {
            background: rgba(12, 12, 12, 0.95);
            color: var(--text);
            border-radius: 6px;
            border: 1px solid var(--border);
        }
        .leaflet-popup-tip { background: rgba(12, 12, 12, 0.95); }
        .popup-title { font-family: var(--display); font-size: 15px; font-weight: 600; letter-spacing: 1px; margin-bottom: 4px; color: #fff; }
        .popup-type { font-size: 11px; color: var(--text-ghost); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .popup-coords { font-size: 11px; color: var(--text-dim); font-family: monospace; }
        .popup-desc { font-size: 12px; margin-top: 6px; color: var(--text-dim); }

        /* User markers panel */
        .user-marker-form { padding: 12px 20px; border-bottom: 1px solid var(--border); }
        .user-marker-form h3 {
            font-family: var(--display);
            font-size: 11px;
            text-transform: uppercase;
            color: var(--text-ghost);
            margin-bottom: 8px;
            letter-spacing: 2px;
        }
        .user-marker-form input, .user-marker-form select {
            width: 100%;
            padding: 7px 10px;
            margin-bottom: 6px;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 4px;
            font-size: 12px;
            font-family: var(--body);
        }
        .user-marker-form input:focus, .user-marker-form select:focus { outline: none; border-color: var(--accent); }
        .btn {
            padding: 7px 14px;
            background: var(--surface-raised);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            width: 100%;
            font-family: var(--body);
            transition: border-color 0.2s, background 0.2s;
        }
        .btn:hover { border-color: var(--border-hover); background: #282828; }
        .btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-accent:hover { background: #e02525; }
        .btn-danger { background: rgba(204,31,31,0.15); border-color: rgba(204,31,31,0.3); color: var(--accent); }
        .btn-danger:hover { background: rgba(204,31,31,0.25); }

        .custom-marker-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }
        .custom-marker-item .marker-info { cursor: pointer; flex: 1; }
        .custom-marker-item .marker-info:hover { color: #fff; }
        .custom-marker-item .marker-delete {
            background: rgba(204,31,31,0.15);
            color: var(--accent);
            border: none;
            padding: 2px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 10px;
            margin-left: 8px;
        }
        .custom-marker-item .marker-delete:hover { background: rgba(204,31,31,0.3); }

        #place-marker-hint {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(12, 12, 12, 0.95);
            color: #fff;
            padding: 16px 28px;
            border-radius: 6px;
            z-index: 2000;
            font-size: 14px;
            border: 1px solid var(--accent);
        }

        /* Scrollbar */
        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-track { background: transparent; }
        #sidebar::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 2px; }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a class="nav-brand" href="/">
            <span>REFORGED<span class="brand-z">Z</span></span>
        </a>
        <div class="nav-links">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/shop">Shop</a>
            <a class="nav-link active" href="/map">Map</a>
            <a class="nav-link" href="https://discord.gg/reforgedz" target="_blank">Discord</a>
        </div>
    </div>
</nav>

<div id="sidebar">
    <div class="sidebar-header">
        <h1>CHERNARUS</h1>
        <p>Interactive Terrain Map - 15.36km x 15.36km</p>
        <input type="text" id="search-box" placeholder="Search locations..." />
        <div id="search-results"></div>
    </div>

    <div class="layer-section">
        <h3>Layers</h3>
        <div id="layer-toggles"></div>
    </div>

    <div class="layer-section">
        <h3>Overlays</h3>
        <label class="layer-toggle">
            <input type="checkbox" id="toggle-grid" />
            <span class="layer-icon" style="background: rgba(255,255,255,0.3);"></span>
            Grid Overlay (1km)
        </label>
        <label class="layer-toggle">
            <input type="checkbox" id="toggle-coords" checked />
            <span class="layer-icon" style="background: var(--accent);"></span>
            Coordinate Display
        </label>
    </div>

    <div class="user-marker-form">
        <h3>Custom Markers</h3>
        <input type="text" id="custom-name" placeholder="Marker name..." />
        <input type="text" id="custom-desc" placeholder="Description (optional)..." />
        <select id="custom-type">
            <option value="custom">Custom Pin</option>
            <option value="base">Base / Camp</option>
            <option value="danger">Danger Zone</option>
            <option value="loot">Loot Spot</option>
            <option value="objective">Objective</option>
        </select>
        <button class="btn btn-accent" id="btn-place-marker">Click to Place Marker</button>
        <button class="btn" id="btn-export-markers" style="margin-top:5px;">Export Markers (JSON)</button>
        <button class="btn" id="btn-import-markers" style="margin-top:5px;">Import Markers (JSON)</button>
        <input type="file" id="import-file" accept=".json" style="display:none;" />
        <button class="btn btn-danger" id="btn-clear-custom" style="margin-top:5px;">Clear All Custom</button>
    </div>

    <div class="layer-section" id="custom-markers-list-section" style="display:none;">
        <h3>Your Markers</h3>
        <div id="custom-markers-list"></div>
    </div>
</div>

<button id="sidebar-toggle">&#9776;</button>
<div id="coords-display">X: 0 | Z: 0</div>
<div id="credits">Map by Bonzi & Soap</div>
<div id="place-marker-hint">Click on the map to place your marker</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="map-data.js"></script>
<script>
// ============================================================
// CONFIG
// ============================================================
const MAP_SIZE = 15360;
const TILE_DIR = 'tiles';
const USE_TILES = false;
const MAX_ZOOM = 7;
const MIN_ZOOM = -4;
const DEFAULT_ZOOM = 0;

// Image bounds offset to align tiles with game coordinates
const IMG_OFFSET_X = 178;
const IMG_OFFSET_Z = 72;
// Right edge pulled in by 128 to fix border alignment
const mapBounds = [[IMG_OFFSET_Z, IMG_OFFSET_X], [MAP_SIZE + IMG_OFFSET_Z, MAP_SIZE + IMG_OFFSET_X - 128]];

const map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: MIN_ZOOM,
    maxZoom: MAX_ZOOM,
    maxBounds: [[-5000, -5000], [MAP_SIZE + 5000, MAP_SIZE + 5000]],
    maxBoundsViscosity: 0.5,
    zoomControl: false
});

L.control.zoom({ position: 'topright' }).addTo(map);
map.setView([MAP_SIZE / 2, MAP_SIZE / 2], DEFAULT_ZOOM);

// ============================================================
// BASE MAP LAYER
// ============================================================
if (USE_TILES) {
    L.tileLayer(TILE_DIR + '/{z}/{x}/{y}.png', {
        minZoom: 0,
        maxZoom: 5,
        maxNativeZoom: 5,
        noWrap: true,
        bounds: mapBounds,
        tileSize: 256,
        tms: true
    }).addTo(map);
} else {
    try {
        L.imageOverlay('map-image-hires.jpg', mapBounds).addTo(map);
    } catch(e) {
        console.log('No map image found.');
    }
}

// Map boundary outline
L.rectangle(mapBounds, {
    color: '#000000',
    weight: 2,
    fill: false,
    interactive: false
}).addTo(map);

// ============================================================
// MARKER DEFINITIONS
// ============================================================
const MARKER_STYLES = {
    city:       { color: '#FFD700', icon: '🏙️', size: 28 },
    town:       { color: '#4a9eff', icon: '🏘️', size: 24 },
    village:    { color: '#6bc46b', icon: '🏠', size: 20 },
    military:   { color: '#cc1f1f', icon: '⚔️', size: 26 },
    quest:      { color: '#cc66ff', icon: '❗', size: 22 },
    landmark:   { color: '#ff9900', icon: '📍', size: 22 },
    road:       { color: '#888888', icon: '🛣️', size: 18 },
    custom:     { color: '#ffffff', icon: '📌', size: 22 },
    base:       { color: '#00cc66', icon: '🏕️', size: 24 },
    danger:     { color: '#cc1f1f', icon: '☠️', size: 24 },
    loot:       { color: '#ffcc00', icon: '💰', size: 22 },
    objective:  { color: '#ff66cc', icon: '🎯', size: 24 }
};

function createMarkerIcon(type) {
    const style = MARKER_STYLES[type] || MARKER_STYLES.custom;
    return L.divIcon({
        html: `<div class="custom-marker" style="background:${style.color}; width:${style.size}px; height:${style.size}px;">${style.icon}</div>`,
        iconSize: [style.size, style.size],
        iconAnchor: [style.size/2, style.size/2],
        className: ''
    });
}

function createPopup(marker) {
    const style = MARKER_STYLES[marker.type] || MARKER_STYLES.custom;
    return `
        <div class="popup-title">${marker.name}</div>
        <div class="popup-type" style="color:${style.color}">${marker.type}</div>
        <div class="popup-coords">X: ${Math.round(marker.x)} | Z: ${Math.round(marker.z)}${marker.y ? ' | Y: ' + Math.round(marker.y) : ''}</div>
        ${marker.description ? `<div class="popup-desc">${marker.description}</div>` : ''}
    `;
}

// ============================================================
// LAYER GROUPS
// ============================================================
const layerGroups = {};
const layerCounts = {};

function initLayers() {
    const types = [...new Set(MAP_MARKERS.map(m => m.type))];
    types.forEach(type => {
        layerGroups[type] = L.layerGroup().addTo(map);
        layerCounts[type] = 0;
    });
    if (!layerGroups.custom) layerGroups.custom = L.layerGroup().addTo(map);
}

// ============================================================
// POPULATE MARKERS
// ============================================================
function loadMarkers() {
    initLayers();
    MAP_MARKERS.forEach(m => {
        const leafletMarker = L.marker([m.z, m.x], {
            icon: createMarkerIcon(m.type),
            title: m.name
        });
        leafletMarker.bindPopup(createPopup(m));
        leafletMarker.addTo(layerGroups[m.type]);
        layerCounts[m.type] = (layerCounts[m.type] || 0) + 1;
    });
    buildLayerToggles();
}

// ============================================================
// LAYER TOGGLE UI
// ============================================================
function buildLayerToggles() {
    const container = document.getElementById('layer-toggles');
    container.innerHTML = '';
    Object.keys(layerGroups).forEach(type => {
        const style = MARKER_STYLES[type] || MARKER_STYLES.custom;
        const count = layerCounts[type] || 0;
        const label = document.createElement('label');
        label.className = 'layer-toggle';
        label.innerHTML = `
            <input type="checkbox" checked data-layer="${type}" />
            <span class="layer-icon" style="background:${style.color};"></span>
            ${type.charAt(0).toUpperCase() + type.slice(1)}
            <span class="layer-count">${count}</span>
        `;
        container.appendChild(label);
        label.querySelector('input').addEventListener('change', function() {
            if (this.checked) map.addLayer(layerGroups[type]);
            else map.removeLayer(layerGroups[type]);
            saveLayerPrefs();
        });
    });
}

// ============================================================
// SEARCH
// ============================================================
const searchBox = document.getElementById('search-box');
const searchResults = document.getElementById('search-results');

searchBox.addEventListener('input', function() {
    const query = this.value.toLowerCase().trim();
    searchResults.innerHTML = '';
    if (query.length < 2) return;
    const matches = MAP_MARKERS.filter(m => m.name.toLowerCase().includes(query)).slice(0, 10);
    matches.forEach(m => {
        const style = MARKER_STYLES[m.type] || MARKER_STYLES.custom;
        const div = document.createElement('div');
        div.className = 'search-result';
        div.innerHTML = `${m.name} <span class="type-badge" style="background:${style.color};color:#000;">${m.type}</span>`;
        div.addEventListener('click', () => {
            map.setView([m.z, m.x], 5);
            searchResults.innerHTML = '';
            searchBox.value = m.name;
            layerGroups[m.type].eachLayer(layer => {
                if (layer.options.title === m.name) layer.openPopup();
            });
        });
        searchResults.appendChild(div);
    });
});

// ============================================================
// GRID OVERLAY
// ============================================================
const gridLayer = L.layerGroup();
const GRID_SIZE = 1000;

function createGrid() {
    for (let x = 0; x <= MAP_SIZE; x += GRID_SIZE) {
        L.polyline([[0, x], [MAP_SIZE, x]], { color: 'rgba(255,255,255,0.12)', weight: 1 }).addTo(gridLayer);
        if (x < MAP_SIZE) {
            L.marker([200, x + GRID_SIZE/2], {
                icon: L.divIcon({ className: 'grid-label', html: `${x/1000}`, iconSize: [30, 15] })
            }).addTo(gridLayer);
        }
    }
    for (let z = 0; z <= MAP_SIZE; z += GRID_SIZE) {
        L.polyline([[z, 0], [z, MAP_SIZE]], { color: 'rgba(255,255,255,0.12)', weight: 1 }).addTo(gridLayer);
        if (z < MAP_SIZE) {
            L.marker([z + GRID_SIZE/2, 200], {
                icon: L.divIcon({ className: 'grid-label', html: `${z/1000}`, iconSize: [30, 15] })
            }).addTo(gridLayer);
        }
    }
}
createGrid();

document.getElementById('toggle-grid').addEventListener('change', function() {
    if (this.checked) map.addLayer(gridLayer);
    else map.removeLayer(gridLayer);
});

// ============================================================
// COORDINATE DISPLAY
// ============================================================
const coordsDisplay = document.getElementById('coords-display');
map.on('mousemove', function(e) {
    coordsDisplay.textContent = `X: ${Math.round(e.latlng.lng)} | Z: ${Math.round(e.latlng.lat)}`;
});
document.getElementById('toggle-coords').addEventListener('change', function() {
    coordsDisplay.style.display = this.checked ? 'block' : 'none';
});

// ============================================================
// CUSTOM MARKER SYSTEM
// ============================================================
let placingMarker = false;
let customMarkers = JSON.parse(localStorage.getItem('customMarkers') || '[]');
const customLeafletMarkers = {};
const hint = document.getElementById('place-marker-hint');

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function saveCustomMarkers() {
    localStorage.setItem('customMarkers', JSON.stringify(customMarkers));
    renderCustomMarkersList();
}

function saveLayerPrefs() {
    const prefs = {};
    document.querySelectorAll('#layer-toggles input[data-layer]').forEach(cb => {
        prefs[cb.dataset.layer] = cb.checked;
    });
    localStorage.setItem('layerPrefs', JSON.stringify(prefs));
}

function loadLayerPrefs() {
    const prefs = JSON.parse(localStorage.getItem('layerPrefs') || '{}');
    Object.entries(prefs).forEach(([type, visible]) => {
        const cb = document.querySelector(`#layer-toggles input[data-layer="${type}"]`);
        if (cb && !visible) {
            cb.checked = false;
            if (layerGroups[type]) map.removeLayer(layerGroups[type]);
        }
    });
}

function addCustomMarkerToMap(markerData) {
    if (!layerGroups[markerData.type]) {
        layerGroups[markerData.type] = L.layerGroup().addTo(map);
    }
    const popupContent = `
        ${createPopup(markerData)}
        <button onclick="deleteCustomMarker('${markerData.id}')"
                style="margin-top:8px;padding:4px 12px;background:rgba(204,31,31,0.15);color:#cc1f1f;border:1px solid rgba(204,31,31,0.3);border-radius:4px;cursor:pointer;font-size:11px;width:100%;">
            Delete Marker
        </button>
    `;
    const leafletMarker = L.marker([markerData.z, markerData.x], {
        icon: createMarkerIcon(markerData.type),
        title: markerData.name
    });
    leafletMarker.bindPopup(popupContent);
    leafletMarker.addTo(layerGroups[markerData.type]);
    customLeafletMarkers[markerData.id] = leafletMarker;
}

function deleteCustomMarker(id) {
    const idx = customMarkers.findIndex(m => m.id === id);
    if (idx === -1) return;
    const marker = customMarkers[idx];
    if (customLeafletMarkers[id]) {
        if (layerGroups[marker.type]) layerGroups[marker.type].removeLayer(customLeafletMarkers[id]);
        delete customLeafletMarkers[id];
    }
    customMarkers.splice(idx, 1);
    saveCustomMarkers();
    map.closePopup();
}
window.deleteCustomMarker = deleteCustomMarker;

function renderCustomMarkersList() {
    const list = document.getElementById('custom-markers-list');
    const section = document.getElementById('custom-markers-list-section');
    if (customMarkers.length === 0) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = '';
    customMarkers.forEach(m => {
        const style = MARKER_STYLES[m.type] || MARKER_STYLES.custom;
        const div = document.createElement('div');
        div.className = 'custom-marker-item';
        div.innerHTML = `
            <span class="marker-info" data-id="${m.id}">
                <span class="layer-icon" style="background:${style.color};"></span>
                ${m.name} <span style="color:var(--text-ghost);font-size:10px;">(${m.x}, ${m.z})</span>
            </span>
            <button class="marker-delete" data-id="${m.id}">X</button>
        `;
        list.appendChild(div);
        div.querySelector('.marker-info').addEventListener('click', () => {
            map.setView([m.z, m.x], 5);
            if (customLeafletMarkers[m.id]) customLeafletMarkers[m.id].openPopup();
        });
        div.querySelector('.marker-delete').addEventListener('click', () => deleteCustomMarker(m.id));
    });
}

document.getElementById('btn-place-marker').addEventListener('click', function() {
    placingMarker = true;
    hint.style.display = 'block';
    map.getContainer().style.cursor = 'crosshair';
});

map.on('click', function(e) {
    if (!placingMarker) return;
    placingMarker = false;
    hint.style.display = 'none';
    map.getContainer().style.cursor = '';
    const markerData = {
        id: generateId(),
        name: document.getElementById('custom-name').value || 'Custom Marker',
        type: document.getElementById('custom-type').value,
        x: Math.round(e.latlng.lng),
        z: Math.round(e.latlng.lat),
        y: 0,
        description: document.getElementById('custom-desc').value || '',
        created: new Date().toISOString()
    };
    customMarkers.push(markerData);
    addCustomMarkerToMap(markerData);
    saveCustomMarkers();
    document.getElementById('custom-name').value = '';
    document.getElementById('custom-desc').value = '';
});

customMarkers.forEach(m => {
    if (!m.id) m.id = generateId();
    addCustomMarkerToMap(m);
});
renderCustomMarkersList();

document.getElementById('btn-export-markers').addEventListener('click', function() {
    if (customMarkers.length === 0) { alert('No custom markers to export.'); return; }
    const blob = new Blob([JSON.stringify(customMarkers, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `chernarus-markers-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
});

document.getElementById('btn-import-markers').addEventListener('click', function() {
    document.getElementById('import-file').click();
});

document.getElementById('import-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
        try {
            const imported = JSON.parse(ev.target.result);
            if (!Array.isArray(imported)) throw new Error('Not an array');
            let count = 0;
            imported.forEach(m => {
                m.id = generateId();
                if (!m.name || !m.type || m.x === undefined || m.z === undefined) return;
                customMarkers.push(m);
                addCustomMarkerToMap(m);
                count++;
            });
            saveCustomMarkers();
            alert(`Imported ${count} markers.`);
        } catch (err) { alert('Invalid marker file: ' + err.message); }
    };
    reader.readAsText(file);
    this.value = '';
});

document.getElementById('btn-clear-custom').addEventListener('click', function() {
    if (customMarkers.length === 0) return;
    if (!confirm(`Delete all ${customMarkers.length} custom markers?`)) return;
    customMarkers.forEach(m => {
        if (customLeafletMarkers[m.id] && layerGroups[m.type]) layerGroups[m.type].removeLayer(customLeafletMarkers[m.id]);
    });
    customMarkers.length = 0;
    Object.keys(customLeafletMarkers).forEach(k => delete customLeafletMarkers[k]);
    saveCustomMarkers();
});

// ============================================================
// SIDEBAR TOGGLE
// ============================================================
document.getElementById('sidebar-toggle').addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('collapsed');
});

// ============================================================
// INIT
// ============================================================
loadMarkers();
loadLayerPrefs();

map.on('moveend', function() {
    const c = map.getCenter();
    localStorage.setItem('mapView', JSON.stringify({ lat: c.lat, lng: c.lng, zoom: map.getZoom() }));
});

const savedView = JSON.parse(localStorage.getItem('mapView') || 'null');
if (savedView) map.setView([savedView.lat, savedView.lng], savedView.zoom);

map.on('contextmenu', function(e) {
    const x = Math.round(e.latlng.lng);
    const z = Math.round(e.latlng.lat);
    navigator.clipboard.writeText(`${x}, ${z}`).then(() => {
        const popup = L.popup().setLatLng(e.latlng)
            .setContent(`<div style="font-size:12px;">Copied: <b>${x}, ${z}</b></div>`)
            .openOn(map);
        setTimeout(() => map.closePopup(popup), 1500);
    });
});
</script>
</body>
</html>
